<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="VG Logistics Open Graph">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#11355c"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffae00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <!-- Patrón -->
  <g stroke="#fff" stroke-width="1" opacity="0.04">
    <path d="M0 100 L1200 100"/>
    <path d="M0 200 L1200 200"/>
    <path d="M0 300 L1200 300"/>
    <path d="M0 400 L1200 400"/>
    <path d="M0 500 L1200 500"/>
    <path d="M100 0 L100 630"/>
    <path d="M300 0 L300 630"/>
    <path d="M500 0 L500 630"/>
    <path d="M700 0 L700 630"/>
    <path d="M900 0 L900 630"/>
    <path d="M1100 0 L1100 630"/>
  </g>
  <!-- Rutas -->
  <g stroke="#ff6b35" stroke-width="2" fill="none" stroke-dasharray="8 6" opacity="0.4">
    <path d="M100 500 Q 400 350 700 320 T 1100 260"/>
    <path d="M100 530 Q 350 400 650 380 T 1100 330"/>
  </g>
  <!-- Logo -->
  <g transform="translate(80,80)">
    <rect width="100" height="100" rx="20" fill="#1e6fb8"/>
    <path d="M20 28 L38 80 L56 28" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M60 28 Q86 28 86 54 Q86 80 60 80 L60 58 L80 58" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="20" y="88" width="60" height="4" rx="2" fill="#ff6b35"/>
  </g>
  <!-- Wordmark -->
  <text x="200" y="130" font-family="Inter, sans-serif" font-size="52" font-weight="900" fill="#fff">VG Logistics</text>
  <text x="200" y="170" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#ffae00" letter-spacing="3">COMMITTED FRIGO TRANSPORT</text>
  <!-- Título principal -->
  <text x="80" y="340" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#fff">Transporte frigorífico</text>
  <text x="80" y="420" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="url(#og-accent)">internacional en Europa</text>
  <!-- KPIs -->
  <g font-family="Inter, sans-serif" fill="#fff">
    <g transform="translate(80,470)">
      <text font-size="52" font-weight="900">20+</text>
      <text y="30" font-size="16" font-weight="600" fill="#9fb3cf">DESTINOS</text>
    </g>
    <g transform="translate(260,470)">
      <text font-size="52" font-weight="900">12+</text>
      <text y="30" font-size="16" font-weight="600" fill="#9fb3cf">PAÍSES/SEMANA</text>
    </g>
    <g transform="translate(490,470)">
      <text font-size="52" font-weight="900">4</text>
      <text y="30" font-size="16" font-weight="600" fill="#9fb3cf">SECTORES</text>
    </g>
    <g transform="translate(600,470)">
      <text font-size="52" font-weight="900">ATP</text>
      <text y="30" font-size="16" font-weight="600" fill="#9fb3cf">CERTIFICADO</text>
    </g>
  </g>
  <!-- URL -->
  <text x="80" y="580" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#9fb3cf">vglogistics.es · Lleida, España</text>
</svg>
