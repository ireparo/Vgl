<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sector cárnico">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee5e0"/>
      <stop offset="100%" stop-color="#fff4f0"/>
    </linearGradient>
    <linearGradient id="m-meat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e85c45"/>
      <stop offset="100%" stop-color="#c03a28"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#m-bg)"/>
  <g opacity="0.3" stroke="#ff6b35" stroke-width="1" fill="none">
    <circle cx="60" cy="60" r="3"/><circle cx="340" cy="80" r="4"/>
    <circle cx="90" cy="240" r="3"/><circle cx="330" cy="230" r="4"/>
  </g>
  <!-- Caja frigorífica -->
  <rect x="100" y="100" width="200" height="140" rx="8" fill="#fff" stroke="#0a2540" stroke-width="2"/>
  <rect x="100" y="100" width="200" height="24" rx="8" fill="#0a2540"/>
  <circle cx="115" cy="112" r="3" fill="#ff6b35"/>
  <circle cx="128" cy="112" r="3" fill="#ffae00"/>
  <circle cx="141" cy="112" r="3" fill="#8ec5ff"/>
  <text x="200" y="116" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">MEAT CHAMBER</text>
  <!-- Piezas de carne -->
  <g>
    <ellipse cx="160" cy="170" rx="30" ry="18" fill="url(#m-meat)"/>
    <ellipse cx="160" cy="168" rx="22" ry="12" fill="#f59983" opacity="0.6"/>
    <circle cx="150" cy="165" r="2" fill="#fff" opacity="0.7"/>
    <ellipse cx="240" cy="195" rx="34" ry="20" fill="url(#m-meat)"/>
    <ellipse cx="240" cy="193" rx="26" ry="13" fill="#f59983" opacity="0.6"/>
    <circle cx="235" cy="190" r="2" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Termómetro -->
  <g transform="translate(320,130)">
    <rect width="40" height="70" rx="6" fill="#0a2540"/>
    <text x="20" y="30" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#8ec5ff" text-anchor="middle">+2°</text>
    <text x="20" y="50" font-family="Inter, sans-serif" font-size="7" font-weight="600" fill="#ff6b35" text-anchor="middle">FRESH</text>
    <circle cx="20" cy="62" r="4" fill="#ff6b35"/>
  </g>
  <!-- Etiqueta -->
  <rect x="120" y="250" width="160" height="24" rx="12" fill="#0a2540"/>
  <text x="200" y="266" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">CADENA DE FRÍO GARANTIZADA</text>
</svg>
