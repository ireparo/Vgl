<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-label="Mapa de cobertura europea VG Logistics">
  <defs>
    <radialGradient id="eu-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1e6fb8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e6fb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eu-land" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef3f9"/>
      <stop offset="100%" stop-color="#d8e1ec"/>
    </linearGradient>
    <filter id="eu-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="500" fill="#f6f9fc"/>
  <rect width="600" height="500" fill="url(#eu-glow)"/>

  <!-- Retícula sutil -->
  <g stroke="#d8e1ec" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
  </g>

  <!-- Contorno estilizado de Europa (formas simplificadas) -->
  <g fill="url(#eu-land)" stroke="#b8c5d6" stroke-width="1.5" stroke-linejoin="round" filter="url(#eu-shadow)">
    <!-- Península Ibérica -->
    <path d="M90 340 Q75 320 85 300 Q95 280 120 285 Q150 280 175 295 Q185 320 175 345 Q160 370 130 370 Q100 365 90 340 Z"/>
    <!-- Francia -->
    <path d="M175 285 Q170 260 195 250 Q220 248 245 265 Q260 290 250 320 Q235 340 205 340 Q180 330 175 305 Z"/>
    <!-- Italia -->
    <path d="M270 280 Q280 270 290 285 Q295 310 300 340 Q305 370 295 385 Q290 395 285 385 Q270 355 265 320 Z"/>
    <!-- Alemania + Benelux -->
    <path d="M250 220 Q270 205 295 215 Q315 225 320 250 Q315 275 290 280 Q260 275 248 260 Q245 240 250 220 Z"/>
    <!-- Reino Unido -->
    <path d="M155 200 Q165 180 180 185 Q195 200 192 225 Q180 245 165 240 Q150 225 155 200 Z"/>
    <!-- Escandinavia -->
    <path d="M280 100 Q295 80 315 85 Q325 105 320 140 Q315 175 300 195 Q285 210 278 190 Q270 160 275 130 Z"/>
    <!-- Polonia -->
    <path d="M325 215 Q350 205 375 215 Q385 235 380 260 Q365 275 340 275 Q322 265 320 245 Z"/>
    <!-- República Checa / Eslovaquia -->
    <path d="M315 270 Q335 265 360 275 Q365 290 355 300 Q335 305 315 295 Z"/>
    <!-- Austria / Hungría -->
    <path d="M310 300 Q340 295 370 305 Q380 320 370 335 Q340 340 315 335 Q300 320 310 300 Z"/>
    <!-- Rumanía -->
    <path d="M385 290 Q410 280 440 295 Q450 320 435 345 Q410 355 385 340 Q375 315 385 290 Z"/>
    <!-- Balcanes / Grecia -->
    <path d="M355 345 Q380 340 400 355 Q405 380 390 400 Q370 410 355 395 Q345 370 355 345 Z"/>
  </g>

  <!-- Rutas desde Lleida -->
  <g stroke="#1e6fb8" stroke-width="2" fill="none" opacity="0.5">
    <path d="M135 345 Q 170 280 220 260" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 200 300 285 310" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 220 240 295 235" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 250 280 355 285" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 280 300 400 315" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 180 280 175 215" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 220 180 310 140" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 280 230 350 245" stroke-dasharray="5 4"/>
    <path d="M135 345 Q 300 320 380 370" stroke-dasharray="5 4"/>
  </g>

  <!-- Hub Lleida -->
  <g>
    <circle cx="135" cy="345" r="28" fill="#ff6b35" opacity="0.15"/>
    <circle cx="135" cy="345" r="18" fill="#ff6b35" opacity="0.3"/>
    <circle cx="135" cy="345" r="10" fill="#ff6b35"/>
    <circle cx="135" cy="345" r="4" fill="#fff"/>
    <text x="135" y="385" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0a2540" text-anchor="middle">LLEIDA</text>
    <text x="135" y="399" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#4a5b73" text-anchor="middle" letter-spacing="1">HUB</text>
  </g>

  <!-- Destinos -->
  <g font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0a2540">
    <g>
      <circle cx="220" cy="260" r="5" fill="#1e6fb8"/>
      <circle cx="220" cy="260" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="230" y="256">París</text>
    </g>
    <g>
      <circle cx="285" cy="310" r="5" fill="#1e6fb8"/>
      <circle cx="285" cy="310" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="295" y="306">Milán</text>
    </g>
    <g>
      <circle cx="295" cy="235" r="5" fill="#1e6fb8"/>
      <circle cx="295" cy="235" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="305" y="231">Frankfurt</text>
    </g>
    <g>
      <circle cx="355" cy="285" r="5" fill="#1e6fb8"/>
      <circle cx="355" cy="285" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="365" y="281">Praga</text>
    </g>
    <g>
      <circle cx="175" cy="215" r="5" fill="#1e6fb8"/>
      <circle cx="175" cy="215" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="185" y="211">Londres</text>
    </g>
    <g>
      <circle cx="310" cy="140" r="5" fill="#1e6fb8"/>
      <circle cx="310" cy="140" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="320" y="136">Hamburgo</text>
    </g>
    <g>
      <circle cx="400" cy="315" r="5" fill="#1e6fb8"/>
      <circle cx="400" cy="315" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="410" y="311">Budapest</text>
    </g>
    <g>
      <circle cx="425" cy="320" r="5" fill="#ff6b35"/>
      <circle cx="425" cy="320" r="8" fill="none" stroke="#ff6b35" opacity="0.4"/>
      <text x="435" y="335">Bucarest</text>
    </g>
    <g>
      <circle cx="350" cy="245" r="5" fill="#1e6fb8"/>
      <circle cx="350" cy="245" r="8" fill="none" stroke="#1e6fb8" opacity="0.4"/>
      <text x="360" y="241">Varsovia</text>
    </g>
  </g>

  <!-- Leyenda -->
  <g transform="translate(20,440)">
    <rect width="180" height="50" rx="8" fill="#fff" stroke="#d8e1ec"/>
    <circle cx="20" cy="20" r="5" fill="#ff6b35"/>
    <text x="32" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0a2540">Hub operativo</text>
    <circle cx="20" cy="38" r="5" fill="#1e6fb8"/>
    <text x="32" y="42" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0a2540">Destinos semanales</text>
  </g>
</svg>
