<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sector lácteo">
  <defs>
    <linearGradient id="d-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#f5f9ff"/>
    </linearGradient>
    <linearGradient id="d-bottle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#e0ecf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#d-bg)"/>

  <!-- Gotas de leche decorativas -->
  <g fill="#fff" opacity="0.8">
    <circle cx="60" cy="70" r="4"/>
    <circle cx="340" cy="85" r="5"/>
    <circle cx="80" cy="240" r="3"/>
    <circle cx="330" cy="230" r="4"/>
  </g>

  <!-- Botella de leche grande -->
  <g transform="translate(100,70)">
    <path d="M10 40 Q10 30 20 30 L35 30 Q35 20 42 20 L58 20 Q65 20 65 30 L80 30 Q90 30 90 40 L90 190 Q90 200 80 200 L20 200 Q10 200 10 190 Z" fill="url(#d-bottle)" stroke="#1e6fb8" stroke-width="2"/>
    <rect x="20" y="70" width="60" height="90" rx="4" fill="#1e6fb8"/>
    <text x="50" y="105" font-family="Inter, sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">FRESH</text>
    <text x="50" y="122" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#8ec5ff" text-anchor="middle">MILK</text>
    <circle cx="50" cy="140" r="8" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M46 140 L49 143 L54 137" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="50" y="175" font-family="Inter, sans-serif" font-size="6" font-weight="600" fill="#8ec5ff" text-anchor="middle" letter-spacing="1">COLD CHAIN</text>
  </g>

  <!-- Queso (a la derecha) -->
  <g transform="translate(220,150)">
    <path d="M0 50 L0 20 L80 0 L80 30 Z" fill="#ffd56b" stroke="#b8841a" stroke-width="2"/>
    <path d="M0 20 L80 0 L80 30 L0 50 Z" fill="none" stroke="#b8841a" stroke-width="2"/>
    <circle cx="20" cy="30" r="4" fill="#fffde0"/>
    <circle cx="40" cy="22" r="3" fill="#fffde0"/>
    <circle cx="55" cy="35" r="3.5" fill="#fffde0"/>
    <circle cx="35" cy="40" r="2.5" fill="#fffde0"/>
  </g>

  <!-- Yogur -->
  <g transform="translate(250,70)">
    <path d="M0 10 L50 10 L46 60 L4 60 Z" fill="#fff" stroke="#8ec5ff" stroke-width="1.5"/>
    <rect x="0" y="4" width="50" height="10" rx="2" fill="#e85c45"/>
    <text x="25" y="38" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#0a2540" text-anchor="middle">YOGUR</text>
  </g>

  <!-- Copo de nieve -->
  <g transform="translate(60,150)" stroke="#8ec5ff" stroke-width="1.5" stroke-linecap="round">
    <line x1="0" y1="-14" x2="0" y2="14"/>
    <line x1="-14" y1="0" x2="14" y2="0"/>
    <line x1="-10" y1="-10" x2="10" y2="10"/>
    <line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>

  <!-- Etiqueta -->
  <rect x="120" y="270" width="160" height="20" rx="10" fill="#1e6fb8"/>
  <text x="200" y="284" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">CADENA DE FRÍO LÁCTEA</text>
</svg>
