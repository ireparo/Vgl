<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sector alimentación">
  <defs>
    <linearGradient id="f-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="f-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#e0ecf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#f-bg)"/>

  <!-- Bandeja preparada -->
  <g transform="translate(60,80)">
    <rect width="280" height="160" rx="12" fill="#0a2540"/>
    <rect x="10" y="10" width="260" height="140" rx="8" fill="url(#f-plate)"/>
    <rect x="10" y="10" width="260" height="28" rx="8" fill="#1e6fb8"/>
    <text x="140" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">READY MEAL</text>
    <text x="140" y="36" font-family="Inter, sans-serif" font-size="6" font-weight="600" fill="#8ec5ff" text-anchor="middle" letter-spacing="1">CHILLED · KEEP BELOW 4°C</text>

    <!-- Compartimentos -->
    <rect x="20" y="50" width="80" height="90" rx="4" fill="#f8fbff" stroke="#d8e1ec" stroke-width="1"/>
    <rect x="105" y="50" width="80" height="90" rx="4" fill="#f8fbff" stroke="#d8e1ec" stroke-width="1"/>
    <rect x="190" y="50" width="70" height="90" rx="4" fill="#f8fbff" stroke="#d8e1ec" stroke-width="1"/>

    <!-- Comida simulada -->
    <g transform="translate(60,95)">
      <circle cx="0" cy="0" r="18" fill="#ffb347"/>
      <circle cx="0" cy="0" r="12" fill="#ffd56b"/>
      <circle cx="-5" cy="-3" r="2" fill="#e85c45"/>
      <circle cx="5" cy="2" r="2" fill="#6db74a"/>
    </g>
    <g transform="translate(145,95)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="#c99673"/>
      <ellipse cx="0" cy="-2" rx="16" ry="8" fill="#e5b386"/>
      <circle cx="-6" cy="-2" r="2" fill="#6db74a"/>
      <circle cx="6" cy="-3" r="2" fill="#e85c45"/>
    </g>
    <g transform="translate(225,95)">
      <circle cx="-6" cy="-4" r="5" fill="#6db74a"/>
      <circle cx="6" cy="-2" r="5" fill="#6db74a"/>
      <circle cx="-3" cy="6" r="5" fill="#6db74a"/>
      <circle cx="8" cy="5" r="4" fill="#6db74a"/>
    </g>
  </g>

  <!-- Vapor decorativo -->
  <g stroke="#d8e1ec" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M150 60 Q155 50 150 40 Q145 30 150 20"/>
    <path d="M200 60 Q205 50 200 40 Q195 30 200 20"/>
    <path d="M250 60 Q255 50 250 40 Q245 30 250 20"/>
  </g>

  <!-- Etiqueta -->
  <rect x="120" y="260" width="160" height="20" rx="10" fill="#ff6b35"/>
  <text x="200" y="274" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">PRODUCTO ELABORADO</text>
</svg>
