<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="VGL — Vidal Gurghian Logistics, S.L.">
  <!-- Letras VGL rojas, italic bold condensed -->
  <g font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-style="italic">
    <text x="0" y="98" font-size="120" fill="#E30613" letter-spacing="-4">VGL</text>
  </g>
  <!-- Globo terráqueo encima, blanco sobre fondo oscuro -->
  <g transform="translate(225,20)">
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    <ellipse cx="0" cy="0" rx="16" ry="7" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="7" ry="16" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#1a1a1a" stroke-width="1.2"/>
  </g>
  <!-- Wordmark blanco -->
  <text x="2" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="4.5">VIDAL GURGHIAN LOGISTICS, S.L.</text>
</svg>
