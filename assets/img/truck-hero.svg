<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Camión frigorífico VG Logistics">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11355c"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3556"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="trailer-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5ecf5"/>
    </linearGradient>
    <linearGradient id="trailer-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8e1ec"/>
      <stop offset="100%" stop-color="#f6f9fc"/>
    </linearGradient>
    <linearGradient id="cab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e6fb8"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="100%" stop-color="#3a8dd6"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cielo con estrellas estilizadas -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.4">
    <circle cx="80" cy="40" r="1"/>
    <circle cx="150" cy="70" r="1.2"/>
    <circle cx="220" cy="30" r="0.8"/>
    <circle cx="310" cy="60" r="1"/>
    <circle cx="420" cy="35" r="1.2"/>
    <circle cx="510" cy="80" r="0.9"/>
    <circle cx="580" cy="50" r="1.1"/>
    <circle cx="60" cy="120" r="0.8"/>
    <circle cx="590" cy="130" r="1"/>
  </g>

  <!-- Líneas de cobertura europeas -->
  <g stroke="#ff6b35" stroke-width="1.5" fill="none" stroke-dasharray="3 4" opacity="0.5">
    <path d="M-20 200 Q 120 160 260 180 T 540 150 T 680 180"/>
    <path d="M-20 230 Q 160 200 320 220 T 660 210"/>
  </g>

  <!-- Suelo/carretera -->
  <rect y="260" width="640" height="100" fill="url(#road)"/>
  <line x1="0" y1="310" x2="640" y2="310" stroke="#ff6b35" stroke-width="2" stroke-dasharray="20 15" opacity="0.7"/>

  <!-- Sombra del camión -->
  <ellipse cx="320" cy="290" rx="240" ry="8" fill="#000" opacity="0.4"/>

  <g filter="url(#shadow)">
    <!-- Semirremolque frigorífico -->
    <rect x="120" y="120" width="340" height="140" rx="8" fill="url(#trailer-body)" stroke="#0a2540" stroke-width="2"/>
    <!-- Líneas de semirremolque -->
    <rect x="130" y="135" width="320" height="110" rx="4" fill="url(#trailer-side)"/>
    <g stroke="#b8c5d6" stroke-width="1" fill="none">
      <line x1="180" y1="135" x2="180" y2="245"/>
      <line x1="230" y1="135" x2="230" y2="245"/>
      <line x1="280" y1="135" x2="280" y2="245"/>
      <line x1="330" y1="135" x2="330" y2="245"/>
      <line x1="380" y1="135" x2="380" y2="245"/>
    </g>
    <!-- Logo VGL en el lateral -->
    <rect x="150" y="160" width="80" height="60" rx="6" fill="#0a2540"/>
    <text x="190" y="185" font-family="Inter, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">VGL</text>
    <text x="190" y="205" font-family="Inter, sans-serif" font-size="6" font-weight="700" fill="#ff6b35" text-anchor="middle" letter-spacing="0.8">FRIGO</text>
    <rect x="152" y="213" width="76" height="3" rx="1.5" fill="#ff6b35"/>
    <!-- Temperatura display -->
    <rect x="250" y="170" width="90" height="40" rx="4" fill="#fff" stroke="#1e6fb8" stroke-width="1.5"/>
    <text x="295" y="192" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0a2540" text-anchor="middle">−20°C</text>
    <text x="295" y="204" font-family="Inter, sans-serif" font-size="5" font-weight="600" fill="#4a5b73" text-anchor="middle" letter-spacing="1">COLD CHAIN</text>
    <!-- Panel de puerta trasera -->
    <rect x="370" y="140" width="75" height="100" rx="3" fill="none" stroke="#b8c5d6" stroke-width="1.5"/>
    <circle cx="440" cy="190" r="3" fill="#1e6fb8"/>

    <!-- Grupo frigorífico -->
    <rect x="120" y="104" width="340" height="20" rx="6" fill="#0a2540"/>
    <rect x="130" y="108" width="60" height="12" rx="2" fill="#1e6fb8"/>
    <g fill="#fff" opacity="0.8">
      <circle cx="140" cy="114" r="2"/>
      <circle cx="150" cy="114" r="2"/>
      <circle cx="160" cy="114" r="2"/>
      <circle cx="170" cy="114" r="2"/>
    </g>

    <!-- Cabeza tractora -->
    <path d="M460 260 L460 150 Q460 135 475 135 L560 135 Q575 135 580 150 L590 180 Q595 200 580 200 L580 260 Z" fill="url(#cab)"/>
    <!-- Parabrisas -->
    <path d="M470 145 Q470 140 478 140 L560 140 Q570 140 572 148 L580 175 Q582 180 575 180 L470 180 Z" fill="url(#window)" opacity="0.9"/>
    <!-- Parrilla -->
    <rect x="578" y="190" width="14" height="20" rx="2" fill="#0a2540"/>
    <rect x="580" y="194" width="10" height="2" fill="#ff6b35"/>
    <rect x="580" y="198" width="10" height="2" fill="#ff6b35"/>
    <!-- Faros -->
    <circle cx="586" cy="215" r="3" fill="#ffae00"/>
    <circle cx="586" cy="215" r="5" fill="#ffae00" opacity="0.4"/>
  </g>

  <!-- Ruedas -->
  <g>
    <circle cx="180" cy="260" r="22" fill="#0a2540"/>
    <circle cx="180" cy="260" r="14" fill="#1a3556"/>
    <circle cx="180" cy="260" r="6" fill="#4a5b73"/>
    <circle cx="240" cy="260" r="22" fill="#0a2540"/>
    <circle cx="240" cy="260" r="14" fill="#1a3556"/>
    <circle cx="240" cy="260" r="6" fill="#4a5b73"/>
    <circle cx="400" cy="260" r="22" fill="#0a2540"/>
    <circle cx="400" cy="260" r="14" fill="#1a3556"/>
    <circle cx="400" cy="260" r="6" fill="#4a5b73"/>
    <circle cx="490" cy="260" r="22" fill="#0a2540"/>
    <circle cx="490" cy="260" r="14" fill="#1a3556"/>
    <circle cx="490" cy="260" r="6" fill="#4a5b73"/>
    <circle cx="550" cy="260" r="22" fill="#0a2540"/>
    <circle cx="550" cy="260" r="14" fill="#1a3556"/>
    <circle cx="550" cy="260" r="6" fill="#4a5b73"/>
  </g>

  <!-- Copos de nieve decorativos -->
  <g fill="#8ec5ff" opacity="0.7">
    <g transform="translate(80,90)"><path d="M0 -10 L0 10 M-10 0 L10 0 M-7 -7 L7 7 M-7 7 L7 -7" stroke="#8ec5ff" stroke-width="1.5" stroke-linecap="round"/></g>
    <g transform="translate(560,70)"><path d="M0 -8 L0 8 M-8 0 L8 0 M-5 -5 L5 5 M-5 5 L5 -5" stroke="#8ec5ff" stroke-width="1.2" stroke-linecap="round"/></g>
    <g transform="translate(40,180)"><path d="M0 -6 L0 6 M-6 0 L6 0" stroke="#8ec5ff" stroke-width="1" stroke-linecap="round"/></g>
    <g transform="translate(600,220)"><path d="M0 -7 L0 7 M-7 0 L7 0 M-4 -4 L4 4" stroke="#8ec5ff" stroke-width="1" stroke-linecap="round"/></g>
  </g>
</svg>
